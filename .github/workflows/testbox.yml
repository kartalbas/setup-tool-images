name: testbox

on:
  push:
    branches: [master]
    paths:
      - testbox/**
      - .github/workflows/testbox.yml
    tags:
      - 'testbox/v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - testbox/**
      - .github/workflows/testbox.yml

jobs:
  testbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kartalbas/testbox
          tags: type=match,pattern=testbox/v(.*),group=1
          flavor: latest=true

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: testbox
          file: testbox/Containerfile
          load: true
          tags: testbox:test
          provenance: false
          sbom: false
          cache-from: type=gha,scope=testbox
          cache-to: type=gha,mode=max,scope=testbox

      - name: Test the image
        run: bash testbox/test.sh testbox:test

      - name: Test the rows of the toolbox in the image
        run: bash toolbox/test.sh testbox:test

      - name: Test the planted-defect library
        run: bash toolbox/test-planted.sh

      - name: Test that every check of the image test is refused when it is planted
        run: bash testbox/test-planted-defects.sh testbox:test

      - name: Test that a wrong Redis series is refused
        run: bash toolbox/test-planted-defects.sh testbox:test redis

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: testbox
          file: testbox/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=testbox

      - name: Test the pushed image
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          bash toolbox/test.sh "ghcr.io/kartalbas/testbox@${DIGEST}"
          bash testbox/test.sh "ghcr.io/kartalbas/testbox@${DIGEST}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        with:
          cosign-release: v3.1.4

      - name: Sign and verify the pushed image
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ github.ref }}
        run: |
          cosign sign --yes "ghcr.io/kartalbas/testbox@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/kartalbas/setup-tool-images/.github/workflows/testbox.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/kartalbas/testbox@${DIGEST}"

      - name: Write the digest and the tags
        if: startsWith(github.ref, 'refs/tags/testbox/v')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "digest: ${DIGEST}"
            echo
            echo "tags: $(echo "${TAGS}" | paste -s -d ' ' -)"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
